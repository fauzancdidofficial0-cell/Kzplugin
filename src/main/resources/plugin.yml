name: KZPlugin
version: 2.0.0
main: com.kz.plugin.KZPlugin
api-version: "1.20"
description: KZ Complete Multi-Server Plugin System
authors: [KZTeam]

commands:
  # ══════ QUIZ ══════
  quiz:
    description: Admin quiz control
    usage: /quiz <start|stop|status> [type]
    permission: kzplugin.admin
    aliases: [quizadmin]

  # ══════ SHOP & ECONOMY ══════
  shop:
    description: Open Shop GUI
    usage: /shop
    aliases: [shopgui, toko]
    permission: kzplugin.cmd.shop
  sell:
    description: Open Sell GUI
    usage: /sell
    aliases: [sellgui]
    permission: kzplugin.cmd.sell
  ah:
    description: Auction House
    usage: /ah [sell|cancel] [price] [amount]
    aliases: [market, auction]
    permission: kzplugin.cmd.ah
  inbox:
    description: Check expired items inbox
    usage: /inbox
    permission: kzplugin.cmd.ah
  bal:
    description: Check balance
    usage: /bal [player]
    aliases: [balance, money]
    permission: kzplugin.cmd.bal
  pay:
    description: Transfer money
    usage: /pay <player> <amount>
    permission: kzplugin.cmd.pay
  baltop:
    description: Top 10 richest players
    usage: /baltop
    permission: kzplugin.cmd.baltop
  cf:
    description: Coinflip gambling
    usage: /cf <amount>
    aliases: [coinflip]
    permission: kzplugin.cmd.cf
  order:
    description: Open Order Market (Global Buy Orders)
    usage: /order
    aliases: [buyorder, orders]
  myorders:
    description: View & manage your buy orders
    usage: /myorders
    aliases: [orderlist, mystash]

  # ══════ ISLAND SYSTEM ══════
  createisland:
    description: Create new island
    usage: /createisland <mode>
    permission: kzplugin.cmd.island
  deleteisland:
    description: Delete your island
    usage: /deleteisland
    permission: kzplugin.cmd.island
  home:
    description: Teleport to island
    usage: /home
    permission: kzplugin.cmd.island
  upisland:
    description: Upgrade island border
    usage: /upisland
    aliases: [upgradeisland]
    permission: kzplugin.cmd.island
  islandsetting:
    description: View island settings
    usage: /islandsetting
    aliases: [islandinfo]
    permission: kzplugin.cmd.island
  nameisland:
    description: Rename your island
    usage: /nameisland <name>
    permission: kzplugin.cmd.island
  visit:
    description: Visit player island
    usage: /visit <player>
    permission: kzplugin.cmd.island
  topisland:
    description: Top 10 islands
    usage: /topisland
    permission: kzplugin.cmd.island
  invite:
    description: Invite player to island
    usage: /invite <player>
    permission: kzplugin.cmd.island
  accept:
    description: Accept island invite
    usage: /accept
    permission: kzplugin.cmd.island
  deny:
    description: Deny island invite
    usage: /deny
    permission: kzplugin.cmd.island
  trust:
    description: Trust player on island
    usage: /trust <player>
    permission: kzplugin.cmd.island
  untrust:
    description: Untrust player
    usage: /untrust <player>
    permission: kzplugin.cmd.island

  # ══════ TPA SYSTEM ══════
  tpa:
    description: Request teleport
    usage: /tpa <player>
    permission: kzplugin.cmd.tpa
  tpaccept:
    description: Accept TPA request
    usage: /tpaccept
    permission: kzplugin.cmd.tpa
  tpadeny:
    description: Deny TPA request
    usage: /tpadeny
    permission: kzplugin.cmd.tpa
  tpcancel:
    description: Cancel TPA request
    usage: /tpcancel
    permission: kzplugin.cmd.tpa

  # ══════ LAND SYSTEM ══════
  landinvite:
    description: Invite player to land
    usage: /landinvite <player>
    permission: kzplugin.cmd.land
  landaccept:
    description: Accept land invite
    usage: /landaccept
    permission: kzplugin.cmd.land
  landdeny:
    description: Deny land invite
    usage: /landdeny
    permission: kzplugin.cmd.land
  landrole:
    description: Set player role in land
    usage: /landrole <player> <role>
    permission: kzplugin.cmd.land
  landkick:
    description: Kick player from land
    usage: /landkick <player>
    permission: kzplugin.cmd.land
  trustland:
    description: Trust player on land
    usage: /trustland <player>
    permission: kzplugin.cmd.land
  memberrule:
    description: Open member rules GUI
    usage: /memberrule
    permission: kzplugin.cmd.land
  trustrule:
    description: Open trust rules GUI
    usage: /trustrule
    permission: kzplugin.cmd.land
  setlandname:
    description: Rename your land
    usage: /setlandname <name>
    permission: kzplugin.cmd.land
  deleteland:
    description: Delete your land
    usage: /deleteland
    permission: kzplugin.cmd.land
  cekcapasitas:
    description: Check land capacity info
    usage: /cekcapasitas
    aliases: [landinfo, landcap]
    permission: kzplugin.cmd.land

  # ══════ GACHA CRATE ══════
  # ✅ FIX: Hapus indentasi berlebih, pisah createkey jadi command sendiri
  gachacreate:
    description: Create a gacha crate at your location
    usage: /gachacreate <title> <desc1> <desc2> <color> <keyName>
    permission: kzplugin.admin
  gachadelete:
    description: Delete the nearest gacha crate
    usage: /gachadelete
    permission: kzplugin.admin
  gachalist:
    description: List all gacha crates
    usage: /gachalist
    permission: kzplugin.admin
  gachapreview:
    description: Preview gacha crate rewards
    usage: /gachapreview [crateId]
    permission: kzplugin.admin
  createkey:
    description: Create a custom crate key item
    usage: /createkey <material> <colored_name>
    permission: kzplugin.admin
    aliases: [makekey]

  # ══════ JOB & REWARD ══════
  job:
    description: Job system
    usage: /job [miner|farmer|hunter]
    permission: kzplugin.cmd.job
  daily:
    description: Daily reward
    usage: /daily
    permission: kzplugin.cmd.daily
  weekly:
    description: Weekly reward
    usage: /weekly
    permission: kzplugin.cmd.weekly

  # ══════ LOBBY & INFO ══════
  lobby:
    description: Teleport to lobby server
    usage: /lobby
    aliases: [hub]
    permission: kzplugin.cmd.lobby
  spawn:
    description: Teleport to spawn/island
    usage: /spawn
    permission: kzplugin.cmd.spawn
  help:
    description: Server help & commands
    usage: /help
    aliases: [?]
    permission: kzplugin.cmd.help
  stats:
    description: Player statistics
    usage: /stats [player]
    permission: kzplugin.cmd.stats
  rank:
    description: Rank information
    usage: /rank
    aliases: [ranks]
    permission: kzplugin.cmd.rank
  discord:
    description: Discord link
    usage: /discord
    aliases: [dc]
    permission: kzplugin.cmd.discord
  website:
    description: Website/Store link
    usage: /website
    aliases: [web, store]
    permission: kzplugin.cmd.website
  rules:
    description: Server rules
    usage: /rules
    permission: kzplugin.cmd.rules

  # ══════ RANK-LOCKED COMMANDS ══════
  nick:
    description: Change nickname (Iron+)
    usage: /nick <name|off>
    permission: kzplugin.cmd.nick
  hat:
    description: Wear item as hat (Gold+)
    usage: /hat
    permission: kzplugin.cmd.hat
  enderchest:
    description: Open enderchest (Diamond+)
    usage: /enderchest
    aliases: [ec]
    permission: kzplugin.cmd.enderchest
  craft:
    description: Open crafting table (Emerald+)
    usage: /craft
    aliases: [workbench, wb]
    permission: kzplugin.cmd.craft
  fly:
    description: Toggle flight (Obsidian+)
    usage: /fly
    permission: kzplugin.cmd.fly
  heal:
    description: Heal yourself (Onyx+)
    usage: /heal
    permission: kzplugin.cmd.heal
  feed:
    description: Feed yourself (Phantom+)
    usage: /feed
    permission: kzplugin.cmd.feed
  back:
    description: Return to last location (Eclipse+)
    usage: /back
    permission: kzplugin.cmd.back
  god:
    description: Toggle god mode (Ethereal)
    usage: /god
    permission: kzplugin.cmd.god

  # ══════ ADMIN COMMANDS ══════
  setlobby:
    description: Set lobby spawn
    usage: /setlobby
    permission: kzplugin.admin
  setspawn:
    description: Set mode spawn
    usage: /setspawn <mode>
    permission: kzplugin.admin
  createnpc:
    description: Create NPC
    usage: /createnpc <mode> <name> [server]
    permission: kzplugin.admin
  removenpc:
    description: Remove nearby NPC
    usage: /removenpc
    permission: kzplugin.admin
  listnpc:
    description: List all NPCs
    usage: /listnpc
    permission: kzplugin.admin
  givebal:
    description: Give balance to player
    usage: /givebal <player> <amount> [mode]
    aliases: [addbal, ecoGive]
    permission: kzplugin.admin
  removebal:
    description: Remove balance from player
    usage: /removebal <player> <amount> [mode]
    aliases: [takebal, ecoTake]
    permission: kzplugin.admin
  setrank:
    description: Set player rank
    usage: /setrank <player> <rank>
    permission: kzplugin.admin
  maintenance:
    description: Toggle maintenance mode
    usage: /maintenance [on|off]
    permission: kzplugin.admin
  announce:
    description: Broadcast announcement
    usage: /announce <message>
    aliases: [broadcast, bc]
    permission: kzplugin.admin
  clearlag:
    description: Force clear ground items
    usage: /clearlag
    permission: kzplugin.admin
  reloadconfig:
    description: Reload config.yml
    usage: /reloadconfig
    permission: kzplugin.admin
  givekey:
    description: Give crate key to a player
    usage: /givekey <player> <crateId> [amount]
    permission: kzplugin.admin
  # ✅ FIX: menu & settppasar dipindah keluar dari givekey
  menu:
    description: Buka menu teleport
    usage: /menu
  settppasar:
    description: Set lokasi teleport pasar
    usage: /settppasar
    permission: kz.admin

