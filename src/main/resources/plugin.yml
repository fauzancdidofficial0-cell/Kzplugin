name: KZPlugin
version: 2.0.0
main: com.kz.plugin.KZPlugin
api-version: "1.21"
description: KZ Complete Multi-Server Plugin System
authors: [KZTeam]

commands:
  # ══════ QUIZ ══════
  quiz:
    description: Admin quiz control
    usage: /quiz <start|stop|status> [type]
    permission: kzplugin.admin
    aliases: [quizadmin]

  # ══════ SHOP & ECONOMY ══════
  shop:
    description: Open Shop GUI
    usage: /shop
    aliases: [shopgui, toko]
    permission: kzplugin.admin
  sell:
    description: Open Sell GUI
    usage: /sell
    aliases: [sellgui]
    permission: kzplugin.admin
  ah:
    description: Auction House
    usage: /ah [sell|cancel] [price] [amount]
    aliases: [market, auction]
    permission: kzplugin.admin
  inbox:
    description: Check expired items inbox
    usage: /inbox
    permission: kzplugin.admin
  bal:
    description: Check balance
    usage: /bal [player]
    aliases: [balance, money]
    permission: kzplugin.admin
  pay:
    description: Transfer money
    usage: /pay <player> <amount>
    permission: kzplugin.admin
  baltop:
    description: Top 10 richest players
    usage: /baltop
    permission: kzplugin.admin
  cf:
    description: Coinflip gambling
    usage: /cf <amount>
    aliases: [coinflip]
    permission: kzplugin.admin
  order:
    description: Open Order Market
    usage: /order
    aliases: [buyorder, orders]
    permission: kzplugin.admin
  myorders:
    description: View your buy orders
    usage: /myorders
    aliases: [orderlist, mystash]
    permission: kzplugin.admin

  # ══════ ISLAND SYSTEM ══════
  createisland:
    description: Create new island
    usage: /createisland <mode>
    permission: kzplugin.admin
  deleteisland:
    description: Delete your island
    usage: /deleteisland
    permission: kzplugin.admin
  home:
    description: Teleport to island
    usage: /home
    permission: kzplugin.admin
  upisland:
    description: Upgrade island border
    usage: /upisland
    aliases: [upgradeisland]
    permission: kzplugin.admin
  islandsetting:
    description: View island settings
    usage: /islandsetting
    aliases: [islandinfo]
    permission: kzplugin.admin
  nameisland:
    description: Rename your island
    usage: /nameisland <name>
    permission: kzplugin.admin
  visit:
    description: Visit player island
    usage: /visit <player>
    permission: kzplugin.admin
  topisland:
    description: Top 10 islands
    usage: /topisland
    permission: kzplugin.admin
  invite:
    description: Invite player to island
    usage: /invite <player>
    permission: kzplugin.admin
  accept:
    description: Accept island invite
    usage: /accept
    permission: kzplugin.admin
  deny:
    description: Deny island invite
    usage: /deny
    permission: kzplugin.admin
  trust:
    description: Trust player on island
    usage: /trust <player>
    permission: kzplugin.admin
  untrust:
    description: Untrust player
    usage: /untrust <player>
    permission: kzplugin.admin

  # ══════ TPA SYSTEM ══════
  tpa:
    description: Request teleport
    usage: /tpa <player>
    permission: kzplugin.admin
  tpaccept:
    description: Accept TPA request
    usage: /tpaccept
    permission: kzplugin.admin
  tpadeny:
    description: Deny TPA request
    usage: /tpadeny
    permission: kzplugin.admin
  tpcancel:
    description: Cancel TPA request
    usage: /tpcancel
    permission: kzplugin.admin

  # ══════ LAND SYSTEM ══════
  landinvite:
    description: Invite player to land
    usage: /landinvite <player>
    permission: kzplugin.admin
  landaccept:
    description: Accept land invite
    usage: /landaccept
    permission: kzplugin.admin
  landdeny:
    description: Deny land invite
    usage: /landdeny
    permission: kzplugin.admin
  landrole:
    description: Set player role in land
    usage: /landrole <player> <role>
    permission: kzplugin.admin
  landkick:
    description: Kick player from land
    usage: /landkick <player>
    permission: kzplugin.admin
  trustland:
    description: Trust player on land
    usage: /trustland <player>
    permission: kzplugin.admin
  memberrule:
    description: Open member rules GUI
    usage: /memberrule
    permission: kzplugin.admin
  trustrule:
    description: Open trust rules GUI
    usage: /trustrule
    permission: kzplugin.admin
  setlandname:
    description: Rename your land
    usage: /setlandname <name>
    permission: kzplugin.admin
  deleteland:
    description: Delete your land
    usage: /deleteland
    permission: kzplugin.admin
  cekcapasitas:
    description: Check land capacity info
    usage: /cekcapasitas
    aliases: [landinfo, landcap]
    permission: kzplugin.admin

  # ══════ GACHA CRATE ══════
  gachacreate:
    description: Create a gacha crate
    usage: /gachacreate <title> <desc1> <desc2> <color> <keyName>
    permission: kzplugin.admin
  gachadelete:
    description: Delete nearest gacha crate
    usage: /gachadelete
    permission: kzplugin.admin
  gachalist:
    description: List all gacha crates
    usage: /gachalist
    permission: kzplugin.admin
  gachapreview:
    description: Preview gacha crate rewards
    usage: /gachapreview [crateId]
    permission: kzplugin.admin
  createkey:
    description: Create a custom crate key item
    usage: /createkey <material> <colored_name>
    permission: kzplugin.admin
    aliases: [makekey]
  givekey:
    description: Give crate key to a player
    usage: /givekey <player> <crateId> [amount]
    permission: kzplugin.admin

  # ══════ JOB & REWARD ══════
  job:
    description: Job system
    usage: /job [miner|farmer|hunter]
    permission: kzplugin.admin
  daily:
    description: Daily reward
    usage: /daily
    permission: kzplugin.admin
  weekly:
    description: Weekly reward
    usage: /weekly
    permission: kzplugin.admin

  # ══════ LOBBY & INFO ══════
  lobby:
    description: Teleport to lobby
    usage: /lobby
    aliases: [hub]
    permission: kzplugin.admin
  spawn:
    description: Teleport to spawn
    usage: /spawn
    permission: kzplugin.admin
  help:
    description: Server help & commands
    usage: /help
    permission: kzplugin.admin
  stats:
    description: Player statistics
    usage: /stats [player]
    permission: kzplugin.admin
  rank:
    description: Rank information
    usage: /rank
    aliases: [ranks]
    permission: kzplugin.admin
  discord:
    description: Discord link
    usage: /discord
    aliases: [dc]
    permission: kzplugin.admin
  website:
    description: Website/Store link
    usage: /website
    aliases: [web, store]
    permission: kzplugin.admin
  rules:
    description: Server rules
    usage: /rules
    permission: kzplugin.admin

  # ══════ RANK-LOCKED COMMANDS ══════
  nick:
    description: Change nickname
    usage: /nick <name|off>
    permission: kzplugin.admin
  hat:
    description: Wear item as hat
    usage: /hat
    permission: kzplugin.admin
  enderchest:
    description: Open enderchest
    usage: /enderchest
    aliases: [ec]
    permission: kzplugin.admin
  craft:
    description: Open crafting table
    usage: /craft
    aliases: [workbench, wb]
    permission: kzplugin.admin
  fly:
    description: Toggle flight
    usage: /fly
    permission: kzplugin.admin
  heal:
    description: Heal yourself
    usage: /heal
    permission: kzplugin.admin
  feed:
    description: Feed yourself
    usage: /feed
    permission: kzplugin.admin
  back:
    description: Return to last location
    usage: /back
    permission: kzplugin.admin
  god:
    description: Toggle god mode
    usage: /god
    permission: kzplugin.admin

  # ══════ ADMIN COMMANDS ══════
  setlobby:
    description: Set lobby spawn
    usage: /setlobby
    permission: kzplugin.admin
  setspawn:
    description: Set world spawn
    usage: /setspawn
    permission: kzplugin.admin
  createnpc:
    description: Create NPC
    usage: /createnpc <mode> <name>
    permission: kzplugin.admin
  removenpc:
    description: Remove nearby NPC
    usage: /removenpc
    permission: kzplugin.admin
  listnpc:
    description: List all NPCs
    usage: /listnpc
    permission: kzplugin.admin
  givebal:
    description: Give balance to player
    usage: /givebal <player> <amount>
    aliases: [addbal, ecoGive]
    permission: kzplugin.admin
  removebal:
    description: Remove balance from player
    usage: /removebal <player> <amount>
    aliases: [takebal, ecoTake]
    permission: kzplugin.admin
  setrank:
    description: Set player rank
    usage: /setrank <player> <rank>
    permission: kzplugin.admin
  maintenance:
    description: Toggle maintenance mode
    usage: /maintenance
    permission: kzplugin.admin
  announce:
    description: Broadcast announcement
    usage: /announce <message>
    aliases: [broadcast, bc]
    permission: kzplugin.admin
  clearlag:
    description: Clear ground items
    usage: /clearlag
    permission: kzplugin.admin
  reloadconfig:
    description: Reload config
    usage: /reloadconfig
    permission: kzplugin.admin
  menu:
    description: Buka menu teleport
    usage: /menu
    permission: kzplugin.admin
  settppasar:
    description: Set lokasi teleport pasar
    usage: /settppasar
    permission: kzplugin.admin
  vanish:
    description: Toggle vanish
    usage: /vanish
    permission: kzplugin.admin

# ══════════════════════════════════════
#  PERMISSIONS
# ══════════════════════════════════════
permissions:
  kzplugin.admin:
    description: Full admin access
    default: op
  kzplugin.rank.iron:
    description: Iron rank
    default: false
  kzplugin.rank.gold:
    description: Gold rank
    default: false
  kzplugin.rank.diamond:
    description: Diamond rank
    default: false
  kzplugin.rank.emerald:
    description: Emerald rank
    default: false
  kzplugin.rank.obsidian:
    description: Obsidian rank
    default: false
  kzplugin.rank.onyx:
    description: Onyx rank
    default: false
  kzplugin.rank.phantom:
    description: Phantom rank
    default: false
  kzplugin.rank.eclipse:
    description: Eclipse rank
    default: false
  kzplugin.rank.ethereal:
    description: Ethereal rank
    default: false
