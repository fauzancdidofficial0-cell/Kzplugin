# ══════════════════════════════════════════════════════════════
#  KZ PLUGIN v2.0.0 - Configuration
#  Multi-Server Setup (Velocity Proxy)
# ══════════════════════════════════════════════════════════════

# ══════════════════════════════════════
#  SERVER IDENTITY
#  PENTING: Ubah ini per server!
#  - lobby   → untuk server Lobby
#  - survival→ untuk server Survival
#  - void    → untuk server Void (OneBlock/SkyBlock)
#  - custom  → untuk server Custom (Island/Acid)
# ══════════════════════════════════════
server-name: "lobby"

maintenance: false

# ══════════════════════════════════════
#  SPAWN (set via /setlobby or /setspawn)
# ══════════════════════════════════════
spawn:
  world: "world"
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# ══════════════════════════════════════
#  DATABASE (PlanetScale MySQL)
#  SSL wajib true untuk PlanetScale
# ══════════════════════════════════════
database:
  host: "aws.connect.psdb.cloud"
  port: 3306
  name: "kzplugin"
  username: "YOUR_USERNAME"
  password: "YOUR_PASSWORD"
  ssl: true

# ══════════════════════════════════════
#  ECONOMY
#  7 mode terpisah, saldo tidak lintas mode
# ══════════════════════════════════════
economy:
  currency-symbol: "$"
  
  starting-balance:
    lobby: 0
    survival: 1000
    vanilla: 1000
    oneblock: 1000
    skyblock: 1000
    island: 2000
    acid: 500

  world-mode-map:
    world_lobby: "lobby"
    world_survival: "survival"
    world_vanilla: "vanilla"
    world_oneblock: "oneblock"
    world_skyblock: "skyblock"
    world_island: "island"
    world_acid: "acid"
    world: "survival"
    world_nether: "survival"
    world_the_end: "survival"

# ══════════════════════════════════════
#  ISLAND
# ══════════════════════════════════════
island:
  default-border: 25
  upgrade-multiplier: 100
  upgrade-cost-base: 5000
  modes:
    - oneblock
    - skyblock
    - acid
    - island

# ══════════════════════════════════════
#  LAND CLAIM
#  Max size dikontrol oleh Rank di LobbySystem
# ══════════════════════════════════════
land:
  min-size: 5
  max-size:
    member: 25
    iron: 30
    gold: 35
    diamond: 40
    emerald: 50
    obsidian: 60
    onyx: 75
    phantom: 100
    eclipse: 150
    ethereal: 200

# ══════════════════════════════════════
#  JOB SYSTEM
# ══════════════════════════════════════
job:
  change-cooldown-ms: 3600000
  available:
    - miner
    - farmer
    - hunter
  rewards:
    miner:
      stone: 0.5
      coal_ore: 2.0
      iron_ore: 5.0
      gold_ore: 10.0
      diamond_ore: 50.0
    farmer:
      wheat: 1.0
      carrot: 1.0
      potato: 1.0
      beetroot: 1.5
      melon: 2.0
      pumpkin: 2.0
    hunter:
      zombie: 5.0
      skeleton: 5.0
      creeper: 10.0
      spider: 5.0
      enderman: 20.0

# ══════════════════════════════════════
#  DAILY REWARD
# ══════════════════════════════════════
daily:
  cooldown-ms: 86400000
  streak-reset-ms: 172800000
  rewards:
    default: 1000
    streak3: 1500
    streak5: 2000
    streak7: 3000
    streak14: 5000
    streak30: 10000

# ══════════════════════════════════════
#  WEEKLY REWARD
# ══════════════════════════════════════
weekly:
  cooldown-ms: 604800000
  reward: 10000

# ══════════════════════════════════════
#  TPA
# ══════════════════════════════════════
tpa:
  expire-ticks: 1200
  cooldown-ms: 30000

# ══════════════════════════════════════
#  AUCTION HOUSE
# ══════════════════════════════════════
auction:
  max-listings-per-player: 5
  expire-ms: 86400000
  min-price: 1
  max-price: 1000000000

# ══════════════════════════════════════
#  COINFLIP
# ══════════════════════════════════════
coinflip:
  min-bet: 100
  max-bet: 50000

# ══════════════════════════════════════
#  SCOREBOARD
# ══════════════════════════════════════
scoreboard:
  enabled: true
  update-ticks: 60

# ══════════════════════════════════════
#  CLEARLAG
# ══════════════════════════════════════
clearlag:
  enabled: true
  interval-ticks: 12000
  warning-seconds: 30

# ══════════════════════════════════════
#  AUTO SAVE
# ══════════════════════════════════════
autosave:
  interval-ticks: 6000

# ══════════════════════════════════════
#  FIREWORKS (Lobby decoration)
# ══════════════════════════════════════
fireworks:
  enabled: true
  interval-ticks: 3600

# ══════════════════════════════════════
#  LINKS
# ══════════════════════════════════════
links:
  discord: "https://discord.gg/kzserver"
  website: "https://store.kzserver.com"

# ══════════════════════════════════════
#  MESSAGES
# ══════════════════════════════════════
messages:
  prefix: "§b§lKZ §8»"
  no-permission: "§cYou don't have permission to do that."
  player-only: "§cThis command can only be used by players."
  player-not-found: "§cPlayer not found."
  player-not-online: "§cThat player is not online."
  invalid-amount: "§cPlease enter a valid amount."
  insufficient-funds: "§cYou don't have enough money."
