# ══════════════════════════════════════════════════════════════
#  KZ PLUGIN v2.0.0 - Configuration
#  Multi-Server Setup (Velocity Proxy)
# ══════════════════════════════════════════════════════════════

# ══════════════════════════════════════
#  SERVER IDENTITY
#  PENTING: Ubah ini per server!
#  - lobby   → untuk server Lobby
#  - survival→ untuk server Survival
#  - void    → untuk server Void (OneBlock/SkyBlock)
#  - custom  → untuk server Custom (Island/Acid)
# ══════════════════════════════════════
server-name: "lobby"

maintenance: false

# ══════════════════════════════════════
#  SPAWN (set via /setlobby or /setspawn)
# ══════════════════════════════════════
spawn:
  world: "world"
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# ══════════════════════════════════════
#  DATABASE (Railway MySQL)
# ══════════════════════════════════════
database:
  host: "mysql-production-f8ee.up.railway.app"
  port: 3306
  name: "railway"
  username: "root"
  password: "UPubnljraycSkXzlijXDnrrWnqnqCAZE"
  ssl: false

# ══════════════════════════════════════
#  ECONOMY
#  7 mode terpisah, saldo tidak lintas mode
# ══════════════════════════════════════
economy:
  currency-symbol: "$"
  
  starting-balance:
    lobby: 0
    survival: 1000
    vanilla: 1000
    oneblock: 1000
    skyblock: 1000
    island: 2000
    acid: 500

  world-mode-map:
    world_lobby: "lobby"
    world_survival: "survival"
    world_vanilla: "vanilla"
    world_oneblock: "oneblock"
    world_skyblock: "skyblock"
    world_island: "island"
    world_acid: "acid"
    world: "survival"
    world_nether: "survival"
    world_the_end: "survival"

# ══════════════════════════════════════
#  ISLAND
# ══════════════════════════════════════
island:
  default-border: 25
  upgrade-multiplier: 100
  upgrade-cost-base: 5000
  modes:
    - oneblock
    - skyblock
    - acid
    - island

# ══════════════════════════════════════
#  LAND CLAIM
#  Max size dikontrol oleh Rank di LobbySystem
# ══════════════════════════════════════
land:
  min-size: 5
  max-size:
    member: 25
    iron: 30
    gold: 35
    diamond: 40
    emerald: 50
    obsidian: 60
    onyx: 75
    phantom: 100
    eclipse: 150
    ethereal: 200

# ══════════════════════════════════════
#  JOB SYSTEM
# ══════════════════════════════════════
job:
  change-cooldown-ms: 3600000
  available:
    - miner
    - farmer
    - hunter
  rewards:
    miner:
      stone: 0.5
      coal_ore: 2.0
      iron_ore: 5.0
      gold_ore: 10.0
      diamond_ore: 50.0
    farmer:
      wheat: 1.0
      carrot: 1.0
      potato: 1.0
      beetroot: 1.5
      melon: 2.0
      pumpkin: 2.0
    hunter:
      zombie: 5.0
      skeleton: 5.0
      creeper: 10.0
      spider: 5.0
      enderman: 20.0

# ══════════════════════════════════════
#  DAILY REWARD
# ══════════════════════════════════════
daily:
  cooldown-ms: 86400000
  streak-reset-ms: 172800000
  rewards:
    default: 1000
    streak3: 1500
    streak5: 2000
    streak7: 3000
    streak14: 5000
    streak30: 10000

# ══════════════════════════════════════
#  WEEKLY REWARD
# ══════════════════════════════════════
weekly:
  cooldown-ms: 604800000
  reward: 10000

# ══════════════════════════════════════
#  TPA
# ══════════════════════════════════════
tpa:
  expire-ticks: 1200
  cooldown-ms: 30000

# ══════════════════════════════════════
#  AUCTION HOUSE
# ══════════════════════════════════════
auction:
  max-listings-per-player: 5
  expire-ms: 86400000
  min-price: 1
  max-price: 1000000000

# ══════════════════════════════════════
#  COINFLIP
# ══════════════════════════════════════
coinflip:
  min-bet: 100
  max-bet: 50000

# ══════════════════════════════════════
#  SCOREBOARD
# ══════════════════════════════════════
scoreboard:
  enabled: true
  update-ticks: 60

# ══════════════════════════════════════
#  CLEARLAG
# ══════════════════════════════════════
clearlag:
  enabled: true
  interval-ticks: 12000
  warning-seconds: 30

# ============================================================
# COMMAND BLOCKER
# ============================================================

# Command Blocker System
command-blocker:
  enabled: true

  # Commands blocked on ALL servers (security)
  global-blocked:
    - /op
    - /deop
    - /stop
    - /restart
    - /reload
    - /plugins
    - /pl
    - /ver
    - /version
    - /bukkit:reload
    - /bukkit:plugins
    - /bukkit:version
    - /minecraft:op
    - /minecraft:deop
    - /timings
    - /spark
    - /paper

  # Commands blocked per server
  servers:
    lobby:
      message: "This command is not available in the lobby! Select a game mode first."
      commands:
        - /shop
        - /sell
        - /ah
        - /inbox
        - /job
        - /createisland
        - /deleteisland
        - /upisland
        - /islandsetting
        - /nameisland
        - /home
        - /visit
        - /topisland
        - /invite
        - /accept
        - /deny
        - /trust
        - /untrust
        - /landinvite
        - /landaccept
        - /landdeny
        - /landrole
        - /landkick
        - /trustland
        - /memberrule
        - /trustrule
        - /setlandname
        - /deleteland
        - /cekcapasitas
        - /tpa
        - /tpaccept
        - /tpadeny
        - /tpcancel
        - /cf
        - /weekly

    survival:
      message: "This command is only available in island game modes!"
      commands:
        - /createisland
        - /deleteisland
        - /upisland
        - /islandsetting
        - /nameisland

    void:
      message: "Land commands are not available in this game mode!"
      commands:
        - /landinvite
        - /landaccept
        - /landdeny
        - /landrole
        - /landkick
        - /trustland
        - /memberrule
        - /trustrule
        - /setlandname
        - /deleteland
        - /cekcapasitas

    custom:
      message: "Land commands are not available in this game mode!"
      commands:
        - /landinvite
        - /landaccept
        - /landdeny
        - /landrole
        - /landkick
        - /trustland
        - /memberrule
        - /trustrule
        - /setlandname
        - /deleteland
        - /cekcapasitas

  # Commands blocked per game mode
  modes:
    vanilla:
      message: "This command is disabled in Vanilla mode for a pure survival experience!"
      commands:
        - /shop
        - /sell
        - /ah
        - /inbox
        - /cf
        - /job
        - /daily
        - /weekly
        - /baltop

    lobby:
      message: "Select a game mode first before using this command!"
      commands:
        - /shop
        - /sell
        - /ah
        - /inbox
        - /job
        - /createisland
        - /deleteisland
        - /cf

# ============================================================
# QUIZ & AUTO SPAM
# ============================================================

# Quiz System
quiz:
  auto-interval-minutes: 15    # Auto quiz setiap 15 menit
  min-players: 2               # Minimal player untuk auto quiz
  math-timer-seconds: 300      # 5 menit untuk math quiz
  speed-timer-seconds: 120     # 2 menit untuk speed quiz
  fill-timer-seconds: 180      # 3 menit untuk fill quiz
  math-prize: 500.0
  speed-prize: 300.0
  fill-prize: 400.0

# Anti-Spam System
antispam:
  max-identical: 4             # 4 pesan sama = spam
  identical-window-seconds: 10 # dalam 10 detik
  max-rapid: 6                 # 6 pesan apapun
  rapid-window-seconds: 5      # dalam 5 detik
  max-warnings: 3              # 3 warning = kick
  warning-decay-minutes: 30    # warning reset setelah 30 menit
  mute-seconds: 10             # mute 10 detik setelah spam

# Floodgate prefix (for Bedrock detection fallback)
floodgate-prefix: "."

# ══════════════════════════════════════
#  AUTO SAVE
# ══════════════════════════════════════
autosave:
  interval-ticks: 6000

# ══════════════════════════════════════
#  FIREWORKS (Lobby decoration)
# ══════════════════════════════════════
fireworks:
  enabled: true
  interval-ticks: 3600

